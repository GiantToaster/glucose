<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log</title>
<!-- Telegram Mini App: öppnas från knappen "📝 Log" i boten. Sidan har inga data själv: favoriterna kommer i adressen
     (?f=...) när boten visar knappen, och det man väljer skickas tillbaka till boten med sendData. Glukosvärden finns
     aldrig här. Utanför Telegram fungerar den som förhandsvisning med en egen knapp längst ner. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Telegrams egna färger (ljust eller mörkt efter appen), med reserv när sidan öppnas utanför Telegram */
:root{--bg:var(--tg-theme-bg-color,#fff);--fg:var(--tg-theme-text-color,#101418);--hint:var(--tg-theme-hint-color,#6b7680);
  --btn:var(--tg-theme-button-color,#2a8bf2);--btnfg:var(--tg-theme-button-text-color,#fff);--sub:var(--tg-theme-secondary-bg-color,#eef1f4);
  --sec:var(--tg-theme-section-bg-color,var(--bg));--line:color-mix(in srgb,var(--fg) 12%,transparent)}
@media (prefers-color-scheme:dark){:root{--bg:var(--tg-theme-bg-color,#17212b);--fg:var(--tg-theme-text-color,#f5f5f5);--hint:var(--tg-theme-hint-color,#8a96a3);--sub:var(--tg-theme-secondary-bg-color,#0e1621)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--sub);color:var(--fg);font:17px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{padding:12px max(12px,env(safe-area-inset-right)) 96px max(12px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto}
h1{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--hint);margin:6px 4px 0}
.card{background:var(--sec);border-radius:14px;padding:12px}
.favs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fav{all:unset;box-sizing:border-box;min-height:64px;padding:12px 14px;border-radius:12px;background:var(--sub);font-weight:600;font-size:17px;line-height:1.25;overflow-wrap:anywhere;cursor:pointer;border:2px solid transparent;display:flex;align-items:center}
.fav[aria-pressed=true]{border-color:var(--btn);background:color-mix(in srgb,var(--btn) 14%,var(--sub))}
.fav:focus-visible,.dose:focus-visible{outline:2px solid var(--btn);outline-offset:2px}
.empty{color:var(--hint);font-size:15px;margin:4px}
.dosebox{display:flex;flex-direction:column;gap:10px}
.dosebox p{margin:0;font-size:15px;color:var(--hint)}.dosebox p b{color:var(--fg)}
.doses{display:flex;flex-wrap:wrap;gap:8px}
.dose{all:unset;box-sizing:border-box;min-height:52px;min-width:96px;padding:8px 16px;border-radius:12px;background:var(--sub);text-align:center;cursor:pointer;border:2px solid transparent;display:flex;flex-direction:column;justify-content:center}
.dose b{font-size:20px}.dose span{font-size:12px;color:var(--hint)}
.dose[aria-pressed=true]{border-color:var(--btn);background:color-mix(in srgb,var(--btn) 14%,var(--sub))}
input{font:inherit;color:var(--fg);background:var(--sub);border:2px solid transparent;border-radius:12px;padding:12px 14px;min-height:52px;width:100%;outline:none}
input:focus{border-color:var(--btn)}input::placeholder{color:var(--hint)}
.own{display:flex;align-items:center;gap:8px}.own input{flex:1;max-width:140px}.own span{color:var(--hint);font-size:15px}
label.lab{display:block;font-size:15px;color:var(--hint);margin:0 2px 8px}
.ex{font-size:13px;color:var(--hint);margin:8px 2px 0}
/* Bara utanför Telegram: en egen knapp i stället för Telegrams huvudknapp */
#send{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));min-height:52px;border:0;border-radius:12px;background:var(--btn);color:var(--btnfg);font:600 17px/1 inherit;font-family:inherit}
#send:disabled{opacity:.45}
</style>
</head>
<body>
<main>
  <h1>Favourites</h1>
  <div class="card"><div class="favs" id="favs"></div></div>

  <div class="card dosebox" id="dosebox" hidden>
    <p>Units for <b id="dname"></b></p>
    <div class="doses" id="doses"></div>
    <div class="own"><input id="own" inputmode="decimal" placeholder="Other" aria-label="Other number of units" autocomplete="off"><span>units</span></div>
  </div>

  <h1>Or write anything</h1>
  <div class="card">
    <input id="free" placeholder="pizza 7,5 enheter" autocomplete="off" enterkeyhint="send" aria-label="Write what you ate or did">
    <p class="ex">Meals with units, a dose without food, or a note: promenad 45 min, 1,5 enheter ingen mat</p>
  </div>
</main>
<button id="send" hidden disabled>Log</button>
<script>
// Öppnad från en knapp under skrivfältet får sidan ingen initData, så Telegram känns igen på plattformen ("unknown" utanför)
const W = window.Telegram && Telegram.WebApp, inTg = !!(W && W.platform && W.platform !== 'unknown');
const $ = id => document.getElementById(id), esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const num = s => { const v = parseFloat(String(s).replace(',', '.')); return Number.isFinite(v) && v >= 0 && v <= 100 ? Math.round(v * 10) / 10 : null; };
const units = v => v + (v === 1 ? ' unit' : ' units');
// Favoriterna: ?f= är base64url av JSON [[namn, sparad dos eller null, dos förra gången eller null], ...]
let favs = [];
try { const f = new URLSearchParams(location.search).get('f'); if (f) favs = JSON.parse(decodeURIComponent(escape(atob(f.replace(/-/g, '+').replace(/_/g, '/'))))); } catch {}
if (!Array.isArray(favs)) favs = [];
favs = favs.filter(x => Array.isArray(x) && typeof x[0] === 'string').slice(0, 8);
if (!favs.length && !inTg) favs = [['Havregrynsgröt', 4, 4.5], ['Pizza', 7, null], ['Lax med potatis', 5, 4.5], ['Mackor', 2, null]]; // förhandsvisning
let sel = null, dose = null;

$('favs').innerHTML = favs.length ? favs.map((f, i) => `<button class="fav" data-i="${i}" aria-pressed="false">${esc(f[0])}</button>`).join('')
  : '<p class="empty">Your most logged meals show up here once you have logged a few.</p>';
function pickFav(i) {
  sel = i === sel ? null : i; dose = null; $('own').value = ''; $('free').value = '';
  document.querySelectorAll('.fav').forEach(b => b.setAttribute('aria-pressed', +b.dataset.i === sel));
  $('dosebox').hidden = sel === null;
  if (sel !== null) {
    const [name, saved, last] = favs[sel], opts = [];
    if (saved > 0) opts.push([saved, 'saved']);
    if (last > 0 && last !== saved) opts.push([last, 'last time']);
    $('dname').textContent = name;
    $('doses').innerHTML = opts.map(([v, w]) => `<button class="dose" data-v="${v}" aria-pressed="false"><b>${v}</b><span>${w}</span></button>`).join('');
    if (opts.length === 1) setDose(opts[0][0]); // bara ett eget värde: förvalt, ändras med ett tryck på Other
    $('dosebox').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  haptic(); update();
}
function setDose(v) { dose = v; document.querySelectorAll('.dose').forEach(b => b.setAttribute('aria-pressed', +b.dataset.v === v)); update(); }
$('favs').onclick = e => { const b = e.target.closest('.fav'); if (b) pickFav(+b.dataset.i); };
$('doses').onclick = e => { const b = e.target.closest('.dose'); if (b) { $('own').value = ''; setDose(+b.dataset.v); haptic(); } };
$('own').oninput = () => { dose = num($('own').value); document.querySelectorAll('.dose').forEach(b => b.setAttribute('aria-pressed', false)); update(); };
$('free').oninput = () => { if ($('free').value.trim() && sel !== null) { sel = null; dose = null; document.querySelectorAll('.fav').forEach(b => b.setAttribute('aria-pressed', false)); $('dosebox').hidden = true; } update(); };
$('free').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); send(); } };

// Vad huvudknappen säger och om den går att trycka på
function action() {
  const t = $('free').value.trim();
  if (t) return { label: 'Send', data: { k: 'text', text: t.slice(0, 300) } };
  if (sel !== null && dose !== null) return { label: `Log ${favs[sel][0]} · ${units(dose)}`, data: { k: 'meal', name: favs[sel][0], ins: dose } };
  return null;
}
function update() {
  const a = action();
  if (inTg) { const B = W.MainButton; if (a) { B.setText(a.label.length > 40 ? a.label.slice(0, 39) + '…' : a.label); B.show(); B.enable(); } else B.hide(); }
  else { $('send').hidden = false; $('send').disabled = !a; $('send').textContent = a ? a.label : sel !== null ? 'Choose the units' : 'Log'; }
}
function send() { const a = action(); if (!a) return; haptic('success'); if (inTg) W.sendData(JSON.stringify(a.data)); else { $('send').textContent = 'Preview: would send ' + JSON.stringify(a.data); } }
function haptic(kind) { try { if (!inTg) return; kind ? W.HapticFeedback.notificationOccurred(kind) : W.HapticFeedback.selectionChanged(); } catch {} }
$('send').onclick = send;
if (inTg) { W.ready(); W.expand(); W.MainButton.onClick(send); }
update();
</script>
</body>
</html>
